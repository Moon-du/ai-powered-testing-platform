name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      AI_TASK_MODE: inline
      LLM_PROVIDER: fake
      DEV_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
      - run: python -c "from app.main import app; assert app.openapi()['openapi'].startswith('3.1')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_postgres_password_2026
      OBJECT_STORAGE_ACCESS_KEY: ci-minio-access
      OBJECT_STORAGE_SECRET_KEY: ci-minio-secret-2026
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
